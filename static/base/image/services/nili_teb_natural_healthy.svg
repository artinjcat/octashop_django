<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D89A57"/>
      <stop offset="0.55" stop-color="#A9602E"/>
      <stop offset="1" stop-color="#7A3E1F"/>
    </linearGradient>
    <linearGradient id="woodPestle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3A865"/>
      <stop offset="1" stop-color="#9A5428"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3157D9"/>
      <stop offset="1" stop-color="#172B7A"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CCB47"/>
      <stop offset="1" stop-color="#1D7F3A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#0f1f4e" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- rear leaves -->
    <path d="M28 63C18 50 20 36 35 28c3 14-1 25-7 35Z" fill="url(#leaf)"/>
    <path d="M43 56C34 42 38 26 54 18c5 16 0 29-11 38Z" fill="url(#leaf)"/>
    <path d="M61 57C57 39 66 26 82 23c1 17-8 29-21 34Z" fill="url(#leaf)"/>
    <path d="M80 63c2-15 13-24 28-22-2 15-12 24-28 22Z" fill="url(#leaf)"/>

    <!-- pestle -->
    <g transform="rotate(30 86 43)">
      <rect x="80" y="13" width="13" height="52" rx="6.5" fill="url(#woodPestle)"/>
      <ellipse cx="86.5" cy="15" rx="8.5" ry="5.2" fill="#E9B276"/>
    </g>

    <!-- mortar bowl -->
    <path d="M24 58h70c0 28-10 45-35 45S24 86 24 58Z" fill="url(#wood)"/>
    <path d="M26 58c5 7 17 11 33 11 17 0 29-4 34-11" fill="none" stroke="#F0C18C" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    <path d="M34 82c10 5 25 7 39 3" fill="none" stroke="#7F4526" stroke-width="3" stroke-linecap="round" opacity=".4"/>

    <!-- front leaves -->
    <path d="M20 85c-12-2-18-10-19-21 12 0 20 7 21 18Z" fill="url(#leaf)"/>
    <path d="M33 96c-10 2-18-2-23-11 10-4 19-1 24 7Z" fill="url(#leaf)"/>
    <path d="M70 96c7-12 19-17 31-12-4 12-14 19-31 12Z" fill="url(#leaf)"/>
    <path d="M85 88c8-13 20-16 33-9-6 12-17 17-33 9Z" fill="url(#leaf)"/>

    <!-- small flowers -->
    <g transform="translate(42 52)">
      <circle cx="0" cy="-5" r="4" fill="#fff"/>
      <circle cx="5" cy="0" r="4" fill="#fff"/>
      <circle cx="0" cy="5" r="4" fill="#fff"/>
      <circle cx="-5" cy="0" r="4" fill="#fff"/>
      <circle cx="0" cy="0" r="3" fill="#F2B735"/>
    </g>
    <g transform="translate(56 56) scale(.8)">
      <circle cx="0" cy="-5" r="4" fill="#fff"/>
      <circle cx="5" cy="0" r="4" fill="#fff"/>
      <circle cx="0" cy="5" r="4" fill="#fff"/>
      <circle cx="-5" cy="0" r="4" fill="#fff"/>
      <circle cx="0" cy="0" r="3" fill="#F2B735"/>
    </g>

    <!-- shield -->
    <path d="M77 70 95 63l18 7v14c0 15-8 25-18 30-10-5-18-15-18-30V70Z" fill="url(#indigo)" stroke="#DCE6FF" stroke-width="4"/>
    <path d="M85 81c5 1 9 5 10 11-6-1-10-5-10-11Zm21-2c-8 1-13 7-14 14 8-1 13-6 14-14Z" fill="#fff"/>
    <path d="m90 99 4 4 8-10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>