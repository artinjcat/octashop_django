<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B73F0"/>
      <stop offset="1" stop-color="#192C7A"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4C8A5"/>
      <stop offset="1" stop-color="#D89B72"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76D24E"/>
      <stop offset="1" stop-color="#1F7D3D"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#0F1F4E" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- chat bubble -->
    <path d="M80 18h28c7 0 12 5 12 12v18c0 7-5 12-12 12H96l-10 8 2-8h-8c-7 0-12-5-12-12V30c0-7 5-12 12-12Z"
          fill="#fff" stroke="#2D57C8" stroke-width="4"/>
    <circle cx="86" cy="39" r="3" fill="#2D57C8"/>
    <circle cx="96" cy="39" r="3" fill="#2D57C8"/>
    <circle cx="106" cy="39" r="3" fill="#2D57C8"/>

    <!-- clock badge -->
    <circle cx="92" cy="85" r="26" fill="#fff" stroke="url(#indigo)" stroke-width="6"/>
    <path d="M92 85V68M92 85l12 7" fill="none" stroke="#2145AA" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 69c4-8 11-13 20-15" fill="none" stroke="#5DB4FF" stroke-width="4" stroke-linecap="round"/>

    <!-- 24 -->
    <text x="92" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="19" font-weight="700" fill="#17337F">24</text>

    <!-- support agent -->
    <path d="M17 99c3-18 15-28 31-28s28 10 31 28v15H17V99Z" fill="url(#indigo)"/>
    <circle cx="48" cy="48" r="22" fill="url(#skin)"/>
    <path d="M28 51c-2-22 9-34 25-34 12 0 22 7 25 19-11-7-21-9-31-7-9 2-15 9-19 22Z" fill="#1E347F"/>
    <path d="M28 48c-1 15 6 27 20 27 14 0 21-12 20-27-8 4-16 4-22 1-6 2-12 2-18-1Z" fill="#274DAE" opacity=".18"/>

    <!-- headset -->
    <path d="M24 50c0-16 10-29 24-29s24 13 24 29" fill="none" stroke="#1E347F" stroke-width="6" stroke-linecap="round"/>
    <rect x="19" y="47" width="9" height="20" rx="4" fill="#2D57C8"/>
    <rect x="68" y="47" width="9" height="20" rx="4" fill="#2D57C8"/>
    <path d="M73 64c0 9-6 14-16 14" fill="none" stroke="#2D57C8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="55" cy="78" r="3" fill="#2D57C8"/>

    <!-- face -->
    <circle cx="41" cy="50" r="2.2" fill="#443126"/>
    <circle cx="55" cy="50" r="2.2" fill="#443126"/>
    <path d="M42 60c4 4 8 4 12 0" fill="none" stroke="#9B4D3B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- leaves -->
    <path d="M12 89c-7-8-7-18 0-25 8 7 8 17 0 25Z" fill="url(#leaf)"/>
    <path d="M18 95c-8-3-13-10-12-18 9 2 14 8 12 18Z" fill="url(#leaf)"/>
    <path d="M109 101c5-9 13-13 23-9-4 9-12 14-23 9Z" fill="url(#leaf)"/>
  </g>
</svg>