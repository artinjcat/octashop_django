<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3F6DEB"/>
      <stop offset="1" stop-color="#182B78"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C07D"/>
      <stop offset="1" stop-color="#B96A31"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79D14F"/>
      <stop offset="1" stop-color="#1E7D3E"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#0F1F4E" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- leaves behind -->
    <path d="M20 58c-10-8-11-19-3-28 10 8 12 18 3 28Z" fill="url(#leaf)"/>
    <path d="M31 52c-2-13 5-22 17-25 2 13-4 22-17 25Z" fill="url(#leaf)"/>
    <path d="M93 51c4-12 14-17 26-12-4 12-14 17-26 12Z" fill="url(#leaf)"/>
    <path d="M84 45c0-12 8-21 20-21 0 12-8 20-20 21Z" fill="url(#leaf)"/>

    <!-- open box -->
    <path d="M24 55 41 45h46l17 10-9 16H33L24 55Z" fill="#D9904A"/>
    <path d="M29 64h70v37H29V64Z" fill="url(#kraft)"/>
    <path d="M29 64 16 55l8-14 22 15-17 8Z" fill="#E7AE67"/>
    <path d="M99 64 112 55l-8-14-22 15 17 8Z" fill="#E7AE67"/>

    <!-- packing filler -->
    <path d="M35 66c5 2 7 6 9 10m4-10c4 3 7 6 8 10m5-10c5 2 7 6 9 10m6-10c4 2 6 5 8 9"
          fill="none" stroke="#8E5B2B" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>

    <!-- herbal pouch -->
    <path d="M42 39h29l4 39H38l4-39Z" fill="#E7B46C" stroke="#9F5F2A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M48 48h17c0 7-4 13-8.5 16C52 61 48 55 48 48Z" fill="#F7E7C8"/>
    <path d="M52 55c4 0 7 2 8 6-4 0-7-2-8-6Zm10-3c-5 1-8 4-9 8 5-1 8-3 9-8Z" fill="#2150BE"/>

    <!-- small jar -->
    <rect x="70" y="47" width="18" height="25" rx="5" fill="#8B4A23"/>
    <rect x="68" y="43" width="22" height="6" rx="3" fill="#D4A13A"/>
    <rect x="72" y="56" width="14" height="8" rx="2" fill="#F6E7C5"/>
    <path d="M76 60c3 0 5 1 6 4-3 0-5-1-6-4Z" fill="#2150BE"/>

    <!-- front box logo -->
    <path d="M49 80c5 0 9 3 11 8-6 0-10-3-11-8Zm15-4c-7 1-11 5-13 11 7-1 11-4 13-11Z" fill="#2150BE"/>

    <!-- front leaves -->
    <path d="M20 91c-11-2-18-9-19-19 11 0 19 7 20 17Z" fill="url(#leaf)"/>
    <path d="M31 103c-10 2-18-2-23-10 10-4 18-1 24 6Z" fill="url(#leaf)"/>
    <path d="M85 104c5-11 16-16 27-12-4 11-14 17-27 12Z" fill="url(#leaf)"/>

    <!-- approval shield -->
    <path d="M81 76 97 70l16 6v12c0 13-7 22-16 27-9-5-16-14-16-27V76Z"
          fill="url(#indigo)" stroke="#E5ECFF" stroke-width="3.5"/>
    <path d="m89 91 5 5 10-12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>