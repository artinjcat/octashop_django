<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C73F0"/>
      <stop offset="1" stop-color="#192B79"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4C9A7"/>
      <stop offset="1" stop-color="#D99D74"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79D24F"/>
      <stop offset="1" stop-color="#1F7D3E"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#0F1F4E" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- review card -->
    <rect x="67" y="16" width="49" height="35" rx="8" fill="#fff" stroke="#2D57C8" stroke-width="4"/>
    <g fill="#F2B735">
      <path d="M77 31l2 4 4 .5-3 3 .8 4.5-3.8-2.1-3.8 2.1.8-4.5-3-3 4-.5 2-4Z"/>
      <path d="M88 31l2 4 4 .5-3 3 .8 4.5-3.8-2.1-3.8 2.1.8-4.5-3-3 4-.5 2-4Z"/>
      <path d="M99 31l2 4 4 .5-3 3 .8 4.5-3.8-2.1-3.8 2.1.8-4.5-3-3 4-.5 2-4Z"/>
      <path d="M110 31l2 4 4 .5-3 3 .8 4.5-3.8-2.1-3.8 2.1.8-4.5-3-3 4-.5 2-4Z"/>
    </g>

    <!-- happy customer -->
    <path d="M18 102c2-18 14-29 31-29s29 11 31 29v13H18v-13Z" fill="url(#indigo)"/>
    <circle cx="49" cy="50" r="21" fill="url(#skin)"/>
    <path d="M27 51c-2-21 8-34 24-34 14 0 23 8 26 21-9-7-19-10-29-8-9 2-16 8-21 21Z" fill="#1D347F"/>
    <path d="M27 51c0 16 8 27 22 27 15 0 23-11 23-27-8 4-16 4-23 1-7 2-14 2-22-1Z" fill="#274DAE" opacity=".18"/>
    <circle cx="42" cy="50" r="2.2" fill="#443126"/>
    <circle cx="56" cy="50" r="2.2" fill="#443126"/>
    <path d="M42 60c5 5 10 5 15 0" fill="none" stroke="#9B4D3B" stroke-width="2.8" stroke-linecap="round"/>

    <!-- thumbs up -->
    <path d="M76 83h8c4 0 7 3 7 7v13c0 4-3 7-7 7h-8V83Z" fill="#fff" stroke="#2D57C8" stroke-width="3"/>
    <path d="M75 86 66 80c-3-2-4-6-2-9l3-5c1-2 4-2 5 0l2 9h8v12H75Z" fill="url(#skin)" stroke="#2D57C8" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- approval badge -->
    <circle cx="98" cy="75" r="18" fill="url(#indigo)" stroke="#E5ECFF" stroke-width="4"/>
    <path d="m89 75 6 6 12-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- herbs -->
    <path d="M12 91c-8-8-8-18 0-25 8 7 9 17 0 25Z" fill="url(#leaf)"/>
    <path d="M20 98c-9-3-14-10-13-19 9 2 15 9 13 19Z" fill="url(#leaf)"/>
    <path d="M105 108c5-10 14-14 23-10-4 10-13 15-23 10Z" fill="url(#leaf)"/>
  </g>
</svg>