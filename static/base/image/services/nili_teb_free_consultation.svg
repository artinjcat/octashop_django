<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A72EF"/>
      <stop offset="1" stop-color="#192C79"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C7A4"/>
      <stop offset="1" stop-color="#D79A72"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77D24E"/>
      <stop offset="1" stop-color="#1E7E3D"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#0F1F4E" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- consultant -->
    <path d="M19 102c2-18 14-29 31-29 17 0 29 11 31 29v13H19v-13Z" fill="url(#indigo)"/>
    <circle cx="50" cy="49" r="21" fill="url(#skin)"/>
    <path d="M28 51c-2-21 8-34 24-34 14 0 23 8 26 21-9-7-19-10-29-8-9 2-16 8-21 21Z" fill="#1D347F"/>
    <path d="M27 51c0 16 8 27 23 27 14 0 22-11 22-27-8 4-16 4-23 1-7 2-14 2-22-1Z" fill="#274DAE" opacity=".18"/>

    <!-- headset -->
    <path d="M26 50c0-16 10-28 24-28s24 12 24 28" fill="none" stroke="#1E347F" stroke-width="6" stroke-linecap="round"/>
    <rect x="21" y="47" width="9" height="20" rx="4" fill="#2D57C8"/>
    <rect x="70" y="47" width="9" height="20" rx="4" fill="#2D57C8"/>
    <path d="M75 64c0 8-6 13-16 13" fill="none" stroke="#2D57C8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="57" cy="77" r="3" fill="#2D57C8"/>

    <!-- face -->
    <circle cx="43" cy="50" r="2.2" fill="#443126"/>
    <circle cx="57" cy="50" r="2.2" fill="#443126"/>
    <path d="M44 60c4 4 8 4 12 0" fill="none" stroke="#9B4D3B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- chat bubble -->
    <path d="M80 18h28c7 0 12 5 12 12v17c0 7-5 12-12 12H97l-9 8 2-8H80c-7 0-12-5-12-12V30c0-7 5-12 12-12Z"
          fill="#fff" stroke="#2D57C8" stroke-width="4"/>
    <path d="M82 37h25M82 45h17" stroke="#2D57C8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- free gift -->
    <rect x="84" y="76" width="30" height="27" rx="4" fill="#fff" stroke="#2D57C8" stroke-width="4"/>
    <rect x="81" y="72" width="36" height="9" rx="3" fill="url(#indigo)"/>
    <path d="M99 72v31" stroke="#2D57C8" stroke-width="4"/>
    <path d="M99 73c-7-4-10-8-8-12 2-4 8-1 8 6 0-7 6-10 8-6 2 4-1 8-8 12Z" fill="#F3B83C"/>

    <!-- herbs -->
    <path d="M12 91c-8-8-8-18 0-25 8 7 9 17 0 25Z" fill="url(#leaf)"/>
    <path d="M20 98c-9-3-14-10-13-19 9 2 15 9 13 19Z" fill="url(#leaf)"/>
    <path d="M104 108c5-10 14-14 24-10-4 10-13 15-24 10Z" fill="url(#leaf)"/>

    <!-- mortar -->
    <path d="M75 100h20c0 9-4 14-10 14s-10-5-10-14Z" fill="#A96331"/>
    <path d="M86 96l8-13" stroke="#B9733B" stroke-width="5" stroke-linecap="round"/>
    <path d="M79 96c-1-8 4-14 11-16 1 8-4 14-11 16Z" fill="url(#leaf)"/>
  </g>
</svg>