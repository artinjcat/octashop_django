<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B67E8"/>
      <stop offset="1" stop-color="#172B7A"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B36B"/>
      <stop offset="1" stop-color="#B86B2D"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72CF4D"/>
      <stop offset="1" stop-color="#1D7F3A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.3" flood-color="#0F1F4E" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- motion lines -->
    <path d="M10 42h23M6 52h29M13 62h20" stroke="url(#indigo)" stroke-width="5" stroke-linecap="round"/>

    <!-- clock -->
    <circle cx="48" cy="35" r="20" fill="#fff" stroke="url(#indigo)" stroke-width="6"/>
    <path d="M48 35 58 27M48 35V24" fill="none" stroke="#1D46B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M39 16h18" stroke="#1D46B8" stroke-width="4" stroke-linecap="round"/>

    <!-- leaves behind box -->
    <path d="M69 41c-2-11 5-20 16-22 1 11-5 20-16 22Z" fill="url(#leaf)"/>
    <path d="M79 49c4-10 13-15 24-11-4 10-12 15-24 11Z" fill="url(#leaf)"/>

    <!-- delivery box -->
    <rect x="36" y="46" width="44" height="38" rx="5" fill="url(#box)"/>
    <path d="M57 54c5 0 9 3 11 8-6 0-10-3-11-8Zm14-3c-7 1-12 5-14 11 7-1 12-4 14-11Z" fill="#1D46B8" opacity=".95"/>

    <!-- van body -->
    <path d="M69 60h25l14 13v22H69V60Z" fill="#fff"/>
    <path d="M94 60v14h14L94 60Z" fill="#DCE8FF"/>
    <path d="M69 60h25l14 13v22H69V60Z" fill="none" stroke="#1D46B8" stroke-width="4" stroke-linejoin="round"/>
    <rect x="76" y="66" width="14" height="10" rx="2" fill="#BFD4FF"/>
    <path d="M35 84h73" stroke="#1D46B8" stroke-width="5" stroke-linecap="round"/>

    <!-- wheels -->
    <circle cx="57" cy="96" r="10" fill="#13265F"/>
    <circle cx="57" cy="96" r="4.5" fill="#DDE6F7"/>
    <circle cx="94" cy="96" r="10" fill="#13265F"/>
    <circle cx="94" cy="96" r="4.5" fill="#DDE6F7"/>

    <!-- speed swoosh -->
    <path d="M24 104c18 9 53 12 87 3" fill="none" stroke="#5DB5FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M27 111c20 5 48 6 71 2" fill="none" stroke="#A8D9FF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>