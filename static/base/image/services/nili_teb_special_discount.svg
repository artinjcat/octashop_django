<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C74F0"/>
      <stop offset="1" stop-color="#1A2C7A"/>
    </linearGradient>
    <linearGradient id="sale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B57"/>
      <stop offset="1" stop-color="#C93535"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD86A"/>
      <stop offset="1" stop-color="#D79A1F"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79D24F"/>
      <stop offset="1" stop-color="#1F7D3E"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#0F1F4E" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- confetti -->
    <path d="M18 31l7 4M105 25l6 3M113 51l7-2M20 55l6-2" stroke="#62B7FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="20" r="4" fill="#F2B735"/>
    <circle cx="103" cy="44" r="3" fill="#F2B735"/>

    <!-- discount tag -->
    <path d="M40 29h43l24 24-38 38-43-43 14-19Z" fill="url(#sale)"/>
    <circle cx="49" cy="40" r="5" fill="#fff"/>
    <path d="M52 68 76 44" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="57" cy="48" r="6" fill="none" stroke="#fff" stroke-width="5"/>
    <circle cx="74" cy="65" r="6" fill="none" stroke="#fff" stroke-width="5"/>

    <!-- indigo promo badge -->
    <circle cx="92" cy="87" r="22" fill="url(#indigo)" stroke="#E8EEFF" stroke-width="4"/>
    <path d="M82 88h20M92 78v20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

    <!-- gift ribbon -->
    <path d="M42 93c13 8 30 11 46 7" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 92c-9-3-14-8-12-13 2-5 9-3 14 6 5-9 12-11 14-6 2 5-3 10-12 13Z" fill="url(#gold)"/>

    <!-- herbal leaves -->
    <path d="M18 90c-10-7-12-17-5-26 10 6 13 16 5 26Z" fill="url(#leaf)"/>
    <path d="M26 102c-10-2-17-8-18-17 10 0 18 6 19 15Z" fill="url(#leaf)"/>
    <path d="M89 109c6-10 15-14 25-9-5 10-14 15-25 9Z" fill="url(#leaf)"/>

    <!-- tiny flower -->
    <g transform="translate(81 104)">
      <circle cx="0" cy="-4" r="3.2" fill="#fff"/>
      <circle cx="4" cy="0" r="3.2" fill="#fff"/>
      <circle cx="0" cy="4" r="3.2" fill="#fff"/>
      <circle cx="-4" cy="0" r="3.2" fill="#fff"/>
      <circle cx="0" cy="0" r="2.3" fill="#F2B735"/>
    </g>
  </g>
</svg>