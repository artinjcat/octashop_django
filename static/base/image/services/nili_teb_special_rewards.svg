<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C74F0"/>
      <stop offset="1" stop-color="#1A2C7A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD86A"/>
      <stop offset="1" stop-color="#D79A1F"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79D24F"/>
      <stop offset="1" stop-color="#1F7D3E"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9B66E"/>
      <stop offset="1" stop-color="#B96A31"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#0F1F4E" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- stars/confetti -->
    <path d="M24 23l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1 3-6Z" fill="url(#gold)"/>
    <circle cx="108" cy="27" r="4" fill="#F2B735"/>
    <path d="M103 42l7 4M18 50l7-3M110 58l6 2" stroke="#5AAEFF" stroke-width="3" stroke-linecap="round"/>

    <!-- gift box -->
    <rect x="28" y="57" width="62" height="45" rx="6" fill="url(#indigo)"/>
    <rect x="24" y="49" width="70" height="15" rx="5" fill="#325CD0"/>
    <rect x="54" y="49" width="12" height="53" fill="#F4C34D"/>

    <!-- bow -->
    <path d="M60 49c-10-2-18-8-16-14 2-6 10-5 16 6 6-11 14-12 16-6 2 6-6 12-16 14Z" fill="url(#gold)"/>
    <circle cx="60" cy="49" r="5" fill="#E4A82B"/>

    <!-- herbal prize pouch -->
    <path d="M74 36h22l3 29H71l3-29Z" fill="url(#kraft)" stroke="#9E5E29" stroke-width="2.5"/>
    <path d="M78 45c4 0 7 2 8 6-4 0-7-2-8-6Zm10-3c-5 1-8 4-9 8 5-1 8-3 9-8Z" fill="#244DB8"/>

    <!-- medal -->
    <path d="M93 75l6 21 7-7 8 5-7-22Z" fill="#DFA42C"/>
    <circle cx="98" cy="69" r="16" fill="url(#gold)" stroke="#fff" stroke-width="3"/>
    <path d="M98 57l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1 3-7Z" fill="#fff"/>

    <!-- leaves -->
    <path d="M19 87c-10-7-12-17-5-26 10 6 13 16 5 26Z" fill="url(#leaf)"/>
    <path d="M26 99c-10-2-17-8-18-17 10 0 18 6 19 15Z" fill="url(#leaf)"/>
    <path d="M91 108c6-10 15-14 25-9-5 10-14 15-25 9Z" fill="url(#leaf)"/>

    <!-- little flowers -->
    <g transform="translate(82 101)">
      <circle cx="0" cy="-4" r="3.2" fill="#fff"/>
      <circle cx="4" cy="0" r="3.2" fill="#fff"/>
      <circle cx="0" cy="4" r="3.2" fill="#fff"/>
      <circle cx="-4" cy="0" r="3.2" fill="#fff"/>
      <circle cx="0" cy="0" r="2.3" fill="#F2B735"/>
    </g>
  </g>
</svg>