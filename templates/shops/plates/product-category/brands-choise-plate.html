{% load static %}
{% if products %}
  
  {% for product in products %}

  <div class="flex items-center rounded-lg hover:bg-gray-100 opacity-80">
    <input
      id="checkbox-item-21"
      type="checkbox"
      value=""
      class="w-4 h-4 bg-gray-100 border-gray-300 mr-3"
    />
    <label
      for="checkbox-item-21"
      class="w-full text-xs text-gray-900 rounded pr-1 py-2"
      >{{product.title}}</label
    >
  </div>
    
  {% endfor %}
    

{% endif %}
